name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --select E4,E7,E9,F worker training service tests

  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r service/requirements.txt pytest
      - run: pytest tests/ -v

  evaluate-model:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install CPU inference dependencies
        run: |
          pip install --index-url https://download.pytorch.org/whl/cpu torch==2.3.1
          pip install transformers==4.42.3 pyyaml safetensors

      - name: Download and verify model release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p release-assets models
          gh release download model-v1 \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --clobber
          cd release-assets
          sha256sum -c SHA256SUMS
          cd ..
          tar -xzf release-assets/pythia-70m-v1.tar.gz -C models
          test -s models/v1/config.json
          test -s models/v1/model.safetensors

      - name: Generate predictions
        run: |
          mkdir -p results
          python training/predict.py \
            --model-dir models/v1 \
            --validation data/validation.jsonl \
            --out results/ci_predictions.jsonl

      - name: Score
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --out results/ci_report.json

      - uses: actions/upload-artifact@v4
        with:
          name: ci-score-report
          path: |
            results/ci_report.json
            results/ci_predictions.jsonl

  quality-gate:
    runs-on: ubuntu-latest
    needs: evaluate-model
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ci-score-report
          path: results/
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Enforce 95 percent JSON validity
        run: |
          python tools/score.py \
            results/ci_predictions.jsonl \
            data/validation.jsonl \
            --min-validity 95

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
